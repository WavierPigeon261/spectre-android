name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    - name: Compile APK with Buildozer
      run: |
        buildozer android debug
      env:
        TERM: xterm

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpectreBrowser-Android-APK
        path: bin/*.apk
